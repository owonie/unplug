<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNPLUG: Elemental Survivor</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;overflow:hidden;font-family:'Courier New',monospace;-webkit-user-select:none;user-select:none}
    #game-canvas{width:100vw;height:100vh;display:block}
    #hud{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;padding:16px}
    #stats{color:#fff;font-size:13px;text-shadow:0 0 4px #000;pointer-events:all}
    #stat-panel{margin-top:8px;font-size:11px;color:#ccc;line-height:1.8;background:rgba(0,0,0,0.7);padding:8px 10px;border-radius:6px;border:1px solid #444;max-width:160px;font-family:'Courier New',monospace}
    #skill-slots{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:all}
    .skill-icon{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid #555;position:relative;cursor:pointer;overflow:visible}
    .skill-icon .sk-lvl{position:absolute;bottom:-2px;right:0;font-size:8px;color:#ffcc00;font-weight:bold}
    .skill-icon .sk-cd-overlay{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:4px;pointer-events:none;display:none;overflow:hidden}
    .skill-icon:hover .sk-tooltip{display:block}
    .sk-tooltip{display:none;position:absolute;bottom:34px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.95);border:1px solid #555;border-radius:6px;padding:8px 10px;font-size:10px;color:#ccc;white-space:nowrap;z-index:3000;min-width:160px;text-align:left;line-height:1.5;pointer-events:none}
    .skill-icon.active-tip .sk-tooltip{display:block}
    #hp-bar-bg{width:200px;height:12px;background:#333;border-radius:6px;margin:4px 0;border:1px solid #555;position:relative;overflow:hidden}
    #hp-bar-fill{height:100%;background:linear-gradient(90deg,#ff2222,#ff6644);border-radius:5px;transition:width 0.2s}
    #xp-bar-bg{width:200px;height:8px;background:#222;border-radius:4px;margin:2px 0;border:1px solid #444}
    #xp-bar-fill{height:100%;background:linear-gradient(90deg,#4488ff,#44ddff);border-radius:3px;transition:width 0.1s}
    #timer{position:fixed;top:16px;right:16px;color:#aaa;font-size:14px}
    #kills{position:fixed;top:36px;right:16px;color:#ff6644;font-size:13px}
    #log{position:fixed;bottom:16px;right:16px;color:#8a8;font-size:11px;text-align:right;max-width:300px;opacity:0.8}
    /* Level up popup */
    #levelup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);border:2px solid #ffcc00;border-radius:12px;padding:24px;display:none;pointer-events:all;text-align:center;min-width:400px;z-index:1000}
    #levelup h2{color:#ffcc00;margin-bottom:12px;font-size:18px}
    .choice-btn{display:block;width:100%;padding:12px;margin:8px 0;background:#1a1a2a;border:1px solid #444;color:#fff;font-size:13px;cursor:pointer;border-radius:6px;font-family:inherit;text-align:left}
    .choice-btn:hover{background:#2a2a4a;border-color:#ffcc00}
    .choice-btn span{color:#ffcc00;font-weight:bold}
    #controls-hint{position:fixed;bottom:16px;left:16px;color:#555;font-size:10px}
    .dmg-popup{position:fixed;color:#fff;font-weight:bold;pointer-events:none;animation:dmg-float 0.9s ease-out forwards;text-shadow:0 0 4px #000,0 0 2px #000,1px 1px 0 #000;z-index:999;transform:translateX(-50%)}
    .dmg-popup.crit{color:#ff4400;text-shadow:0 0 10px #ff0000,0 0 20px #ff4400}
    @keyframes dmg-float{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.2)}30%{transform:translateX(-50%) translateY(-25px) scale(1.3)}100%{opacity:0;transform:translateX(-50%) translateY(-70px) scale(0.6)}}
    @keyframes magic-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    @keyframes skill-name-fade{0%{opacity:1;transform:translateX(-50%) scale(1.2)}30%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(0.8)}}
    @keyframes flash-fade{0%{opacity:1}100%{opacity:0}}
    @keyframes lvlflash{0%{opacity:1}100%{opacity:0}}
    @keyframes promo-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(0.8) translateY(-30px)}}
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <!-- Start Screen -->
  <div id="start-screen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2000">
    <h1 style="color:#ff8844;font-size:48px;margin-bottom:8px;text-shadow:0 0 20px #ff4400">UNPLUG</h1>
    <p style="color:#888;font-size:14px;margin-bottom:24px">Elemental Survivor</p>
    <button id="start-btn" style="padding:12px 32px;font-size:16px;background:#222;color:#fff;border:2px solid #ff8844;border-radius:8px;cursor:pointer;font-family:inherit">⚔️ START GAME</button>
    <button id="tree-btn" style="padding:8px 24px;font-size:13px;background:#111;color:#aaa;border:1px solid #555;border-radius:6px;cursor:pointer;font-family:inherit;margin-top:12px">📖 Class Tree</button>
    <p style="color:#555;font-size:11px;margin-top:16px">[WASD] Move | [SPACE] Dash | Level up to survive</p>
  </div>
  <!-- Class Tree Viewer -->
  <div id="class-tree-screen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.97);display:none;flex-direction:column;align-items:center;z-index:2001;overflow-y:auto;padding:20px">
    <h2 style="color:#ff8844;margin-bottom:12px">📖 Class Promotion Tree</h2>
    <p style="color:#666;font-size:11px;margin-bottom:16px">원소 오브를 모아 전직 조건을 맞추세요. Lv10/25/45에서 전직 가능!</p>
    <div id="class-tree-content" style="color:#ccc;font-size:12px;line-height:1.8;max-width:700px;width:100%"></div>
    <button id="tree-close-btn" style="padding:8px 24px;font-size:13px;background:#222;color:#fff;border:1px solid #888;border-radius:6px;cursor:pointer;font-family:inherit;margin-top:20px;margin-bottom:20px">✖ Close</button>
  </div>
  <!-- Pause Menu -->
  <div id="pause-menu" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:1999">
    <h2 style="color:#fff;font-size:28px;margin-bottom:16px">⏸️ PAUSED</h2>
    <p style="color:#888;font-size:12px;margin-bottom:20px">Press ESC to resume</p>
    <div id="pause-skills" style="color:#ccc;font-size:12px;line-height:2;background:rgba(0,0,0,0.5);padding:16px;border-radius:8px;border:1px solid #444;max-width:350px;margin-bottom:16px"></div>
    <button id="resume-btn" style="padding:10px 24px;font-size:14px;background:#222;color:#fff;border:2px solid #888;border-radius:8px;cursor:pointer;font-family:inherit">▶️ Resume</button>
  </div>
  <!-- Game Over Screen -->
  <div id="gameover-screen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:2000">
    <h1 style="color:#ff2222;font-size:36px;margin-bottom:16px">☠️ YOU DIED</h1>
    <div id="final-stats" style="color:#ccc;font-size:14px;line-height:2"></div>
    <div id="points-earned" style="color:#ffcc00;font-size:18px;margin:12px 0"></div>
    <div id="achievements" style="color:#ffcc00;font-size:12px;margin-top:8px;line-height:1.8"></div>
    <div style="margin-top:16px;display:flex;gap:12px">
      <button id="share-btn" style="padding:10px 24px;font-size:14px;background:#1a2a1a;color:#44ff88;border:2px solid #44ff88;border-radius:8px;cursor:pointer;font-family:inherit">🏆 Share Record</button>
      <button id="retry-btn" style="padding:10px 28px;font-size:14px;background:#222;color:#fff;border:2px solid #ff8844;border-radius:8px;cursor:pointer;font-family:inherit">🔄 RETRY</button>
    </div>
    <div id="unlocked-list" style="color:#888;font-size:11px;margin-top:8px"></div>
  </div>
  <div id="hud">
    <div id="stats">
      <div style="display:flex;align-items:center;gap:8px">
        <div id="portrait" style="width:40px;height:40px;border-radius:50%;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:20px;background:#111">🗡️</div>
        <div>
          <div>LV.<span id="level">1</span></div>
          <div id="hp-bar-bg"><div id="hp-bar-fill" style="width:100%"></div><div id="shield-bar-fill" style="width:0%;position:absolute;top:0;left:0;height:100%;background:rgba(180,200,220,0.6);border-radius:5px;transition:width 0.2s"></div></div>
          <div id="xp-bar-bg"><div id="xp-bar-fill" style="width:0%"></div></div>
          <div id="stamina-bar-bg" style="width:200px;height:6px;background:#1a1a1a;border-radius:3px;margin:2px 0;border:1px solid #2a4a2a;display:none"><div id="stamina-bar-fill" style="width:100%;height:100%;background:linear-gradient(90deg,#22aa44,#44ff66);border-radius:2px;transition:width 0.1s"></div></div>
        </div>
      </div>
      <div id="stat-panel"></div>
      <div id="skill-slots"></div>
    </div>
  </div>
  <div id="timer">0:00</div>
  <div id="bgm-btn" style="position:fixed;top:16px;right:80px;color:#666;font-size:11px;cursor:pointer;pointer-events:all;background:rgba(0,0,0,0.5);padding:3px 8px;border-radius:4px;border:1px solid #333">🎵 NEXT</div>
  <div id="kills">0 kills</div>
  <div id="log"></div>
  <div id="controls-hint">[WASD] Move | [SPACE] Dash | [Click/Drag] Skill | Survive!</div>
  <div id="tutorial" style="position:fixed;top:30%;left:50%;transform:translateX(-50%);color:#fff;font-size:16px;text-align:center;pointer-events:none;z-index:800;text-shadow:0 0 8px #000,0 2px 4px rgba(0,0,0,0.8);opacity:0;transition:opacity 0.5s;line-height:2"></div>
  <div id="dash-ui" style="position:fixed;bottom:50px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;pointer-events:none">
    <span style="color:#88ccff;font-size:12px">💨 DASH</span>
    <div style="width:60px;height:6px;background:#333;border-radius:3px;overflow:hidden">
      <div id="dash-bar" style="width:100%;height:100%;background:#44ccff;border-radius:3px;transition:width 0.1s"></div>
    </div>
    <span id="dash-cd-text" style="color:#666;font-size:10px"></span>
  </div>
  <div id="levelup">
    <h2>⬆️ LEVEL UP!</h2>
    <button class="choice-btn" id="choice-0"></button>
    <button class="choice-btn" id="choice-1"></button>
    <button class="choice-btn" id="choice-2"></button>
  </div>

  <script type="module">
    import init, { GameEngine } from './pkg/unplug_engine.js';
    import { ThreeRenderer } from './src/renderer.js';
    import { SoundManager } from './src/sound.js';
    let engine;

    const sound = new SoundManager();
    window._sound = sound;

    // BGM next button
    document.getElementById('bgm-btn').addEventListener('click', () => {
      sound.init();
      sound.nextBGM();
    });

    // New upgrade ID scheme:
    // 50~53: element orbs (fire/ice/thunder/poison)
    // 60~68: stats (dmg/spd/aspd/range/cleave/hp/crit/steal/magnet)
    // 100+class_id: promotion
    // 200+skill_id: class skill upgrade
    function getUpgradeName(id) {
      if (id >= 50 && id <= 53) return ['🔥 Fire Orb', '❄️ Ice Orb', '⚡ Thunder Orb', '☠️ Poison Orb'][id - 50];
      if (id >= 60 && id <= 68) return ['⚔️ DMG +10', '👟 SPD +', '⚡ ATK SPD', '🎯 RANGE +', '🔫 CLEAVE +', '❤️ HP +30', '💥 CRIT +15%', '🧛 STEAL +5%', '🧲 MAGNET +'][id - 60];
      if (id >= 100 && id <= 199) {
        if (!engine) return '👑 PROMOTE!';
        const name = engine.class_name_for_choice(id);
        return `👑 ${name || 'PROMOTE!'}`;
      }
      if (id >= 200) {
        // Get skill name from engine
        const skillIdx = engine.learned_skill_count();
        for (let i = 0; i < skillIdx; i++) {
          if (engine.learned_skill_id(i) === (id - 200)) {
            return `📈 ${engine.learned_skill_name(i)}`;
          }
        }
        return `📈 Skill Up`;
      }
      return '?';
    }
    function getUpgradeDesc(id) {
      if (id >= 50 && id <= 53) {
        const descs = ['화염 오브 +1. 화염 스킬 해금 조건.', '빙결 오브 +1. 빙결 스킬 해금 조건.', '번개 오브 +1. 번개 스킬 해금 조건.', '맹독 오브 +1. 독 스킬 해금 조건.'];
        return descs[id - 50];
      }
      if (id >= 60 && id <= 68) {
        const descs = ['공격력 +10', '이동속도 +0.6', '공격속도 +', '범위 +0.8', '클리브 +1', 'MAX HP +30', '크리티컬 +15%', '흡혈 +5%', 'XP 범위 +2'];
        return descs[id - 60];
      }
      if (id >= 100 && id <= 145) return '🌟 전직! 전용 스킬 3개 해금 + 스탯 대폭 증가.';
      if (id >= 200) return '전직 스킬 강화. 레벨당 효과 증가.';
      return '';
    }

    async function main() {
      await init();
      engine = new GameEngine();

      const canvas = document.getElementById('game-canvas');
      const renderer = new ThreeRenderer(canvas);

      // === Start Screen ===
      let gameStarted = false;
      document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').style.display = 'none';
        gameStarted = true;
        sound.init();
        sound.startBGM();
        startTutorial();
      });

      // === Tutorial ===
      function startTutorial() {
        const steps = [
          { time: 500, text: '🗡️ WASD로 이동 — 적에게 가까이 가면 자동 공격!', duration: 4000 },
          { time: 5000, text: '💨 SPACE = 대쉬 (무적 회피!)', duration: 3000 },
          { time: 12000, text: '⬆️ 레벨업하면 원소 오브를 모으세요\n조합에 따라 전직이 결정됩니다', duration: 5000 },
          { time: 25000, text: '🖱️ 전직 후: 마우스 클릭/드래그로 스킬 사용!', duration: 4000 },
        ];
        const el = document.getElementById('tutorial');
        steps.forEach(step => {
          setTimeout(() => {
            el.innerHTML = step.text.replace(/\n/g, '<br>');
            el.style.opacity = '1';
            setTimeout(() => { el.style.opacity = '0'; }, step.duration);
          }, step.time);
        });
      }

      // === Class Tree Viewer ===
      document.getElementById('tree-btn').addEventListener('click', () => {
        document.getElementById('class-tree-screen').style.display = 'flex';
        buildClassTree();
      });
      document.getElementById('tree-close-btn').addEventListener('click', () => {
        document.getElementById('class-tree-screen').style.display = 'none';
      });

      function buildClassTree() {
        const tier1 = [
          { name: 'Flame Knight', req: '🔥×2', concept: 'Melee burst' },
          { name: 'Frost Mage', req: '❄️×2', concept: 'AoE slow' },
          { name: 'Storm Warrior', req: '⚡×2', concept: 'Speed+chain' },
          { name: 'Plague Bearer', req: '☠️×2', concept: 'DOT stack' },
          { name: 'Steam Engineer', req: '🔥+❄️', concept: 'Explode+slow' },
          { name: 'Plasma Mage', req: '🔥+⚡', concept: 'Chain explode' },
          { name: 'Hellfire Witch', req: '🔥+☠️', concept: 'Burn+poison' },
          { name: 'Aurora Knight', req: '❄️+⚡', concept: 'Freeze+shock' },
          { name: 'Cryo Alchemist', req: '❄️+☠️', concept: 'Slow+weaken' },
          { name: 'Volt Chemist', req: '⚡+☠️', concept: 'Shock+blast' },
          { name: 'Elemental Blade', req: '🔥+❄️+⚡', concept: 'Balanced' },
          { name: 'Frost Plague', req: '❄️+☠️', concept: 'Freeze+disease' },
          { name: 'Thunder Toxin', req: '⚡+☠️', concept: 'Chain+spread' },
          { name: 'Vile Storm', req: '❄️+⚡+☠️', concept: 'Chaotic AoE' },
          { name: 'Primordial Novice', req: '🔥+❄️+⚡+☠️', concept: 'Jack of all' },
        ];
        const hidden = [
          { name: 'Weapon Master', req: 'ATK 120+', concept: 'Pure physical god' },
          { name: 'Vampire Lord', req: 'Lifesteal 25%+', concept: 'Undying drain' },
          { name: 'Berserker', req: 'AOE 6+', concept: 'Rage AoE' },
          { name: 'Assassin', req: 'Crit 50%+', concept: 'One-shot stealth' },
          { name: 'Windwalker', req: 'Speed 9+', concept: 'Movement = attack' },
        ];
        const tier2 = [
          'Inferno Lord', 'Volcanic Thunder', 'Blizzard Warden', 'Permafrost Plague',
          'Thunder God', 'Plasma Overlord', 'Venom Lord', 'Toxic Glacier',
          'Reactor Core', 'Nova Cannon', 'Demon Summoner', 'Absolute Zero',
          'Bio Freeze', 'Acid Storm', 'Prism Knight', 'Pandemic Frost',
          'Chain Decay', 'Chaos Shaman', 'Primordial Adept', 'Awakened One',
        ];
        const tier3 = [
          'Phoenix', 'Cryomancer', 'Ragnarok', 'Pandemic', 'Antimatter',
          'Supernova', 'Entropy', 'Archfiend', 'Avatar', 'Primordial God',
        ];

        let html = '<h3 style="color:#ffcc00;margin:8px 0">⭐ 1차 전직 (Lv 10+ / Orb 2+)</h3>';
        html += '<table style="width:100%;border-collapse:collapse;margin-bottom:16px">';
        html += '<tr style="color:#888;border-bottom:1px solid #333"><td>Class</td><td>Requirement</td><td>Style</td></tr>';
        tier1.forEach(c => {
          html += `<tr style="border-bottom:1px solid #222"><td style="color:#ff8844;padding:4px 0">${c.name}</td><td>${c.req}</td><td style="color:#666">${c.concept}</td></tr>`;
        });
        html += '</table>';

        html += '<h3 style="color:#ff44ff;margin:8px 0">🌈 히든 전직 (스탯 특화)</h3>';
        html += '<table style="width:100%;border-collapse:collapse;margin-bottom:16px">';
        html += '<tr style="color:#888;border-bottom:1px solid #333"><td>Class</td><td>Requirement</td><td>Style</td></tr>';
        hidden.forEach(c => {
          html += `<tr style="border-bottom:1px solid #222"><td style="color:#ff44ff;padding:4px 0">${c.name}</td><td>${c.req}</td><td style="color:#666">${c.concept}</td></tr>`;
        });
        html += '</table>';

        html += '<h3 style="color:#44ccff;margin:8px 0">🌟 2차 전직 (Lv 25+ / Orb 6+)</h3>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">';
        tier2.forEach(n => { html += `<span style="background:#1a2a3a;padding:3px 8px;border-radius:4px;font-size:11px">${n}</span>`; });
        html += '</div>';

        html += '<h3 style="color:#ffcc00;margin:8px 0">👑 3차 전직 (Lv 45+ / Orb 10+)</h3>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">';
        tier3.forEach(n => { html += `<span style="background:#2a1a00;padding:3px 8px;border-radius:4px;font-size:11px;color:#ffcc00">${n}</span>`; });
        html += '</div>';

        html += '<p style="color:#555;font-size:10px;margin-top:12px">※ 같은 원소를 집중하면 순수 전직, 분산하면 하이브리드 전직이 해금됩니다.</p>';
        document.getElementById('class-tree-content').innerHTML = html;
      }
      // Share record to GitHub Issues (tamper-resistant hash)
      document.getElementById('share-btn').addEventListener('click', () => {
        const kills = engine.kills();
        const level = engine.player_level();
        const time = Math.floor(engine.game_time());
        const className = engine.player_class_name();
        const wave = engine.wave_number();
        const points = engine.final_points();

        // Simple hash for tamper resistance (not crypto, but deters casual editing)
        const payload = `${kills}|${level}|${time}|${wave}|${points}`;
        let hash = 0;
        for (let i = 0; i < payload.length; i++) {
          hash = ((hash << 5) - hash) + payload.charCodeAt(i);
          hash = hash & hash; // 32bit
        }
        const sig = Math.abs(hash).toString(36);

        const title = `🏆 Record: Lv${level} ${className} | ${kills} kills | Wave ${wave}`;
        const body = `## 🎮 Game Record

| Stat | Value |
|------|-------|
| ⭐ Level | ${level} |
| 🗡️ Class | ${className} |
| ☠️ Kills | ${kills} |
| 🌊 Wave | ${wave} |
| ⏱️ Time | ${Math.floor(time/60)}:${(time%60).toString().padStart(2,'0')} |
| 🏅 Points | ${points} |

---
\`sig:${sig}\` | *UNPLUG: Elemental Survivor*`;

        const url = `https://github.com/owonie/unplug/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}&labels=record`;
        window.open(url, '_blank');
      });

      document.getElementById('retry-btn').addEventListener('click', () => {
        document.getElementById('gameover-screen').style.display = 'none';
        engine = new GameEngine();
        gameStarted = true;
        gameOverShown = false;
        // Clear renderer pools
        renderer.enemyMeshes.forEach(m => renderer.scene.remove(m));
        renderer.enemyMeshes = [];
        renderer.orbMeshes.forEach(m => renderer.scene.remove(m));
        renderer.orbMeshes = [];
        renderer.bulletMeshes.forEach(m => renderer.scene.remove(m));
        renderer.bulletMeshes = [];
      });

      // Input (use e.code for Korean IME safety)
      const keyMap = {'KeyW':'w','KeyA':'a','KeyS':'s','KeyD':'d','ArrowUp':'w','ArrowDown':'s','ArrowLeft':'a','ArrowRight':'d','Digit1':'1','Digit2':'2','Digit3':'3'};
      document.addEventListener('keydown', e => {
        const k = keyMap[e.code] || e.key.toLowerCase();
        if (e.code === 'Space') e.preventDefault(); // prevent scroll
        if (e.code === 'Space' && !engine.level_up_pending() && !engine.is_paused()) {
          sound.playDash();
        }

        // ESC = pause toggle
        if (e.code === 'Escape') {
          engine.toggle_pause();
          const paused = engine.is_paused();
          document.getElementById('pause-menu').style.display = paused ? 'flex' : 'none';
          if (paused) updatePauseSkills();
          return;
        }

        engine.on_key_down(k);

        // Level up choice
        if (engine.level_up_pending()) {
          const prevTier = engine.player_class_tier();
          if (k === '1') { engine.choose_upgrade(0); if(engine.player_class_tier()>prevTier) showPromotionEffect(engine.player_class_tier()); hideLevelUp(); }
          if (k === '2') { engine.choose_upgrade(1); if(engine.player_class_tier()>prevTier) showPromotionEffect(engine.player_class_tier()); hideLevelUp(); }
          if (k === '3') { engine.choose_upgrade(2); if(engine.player_class_tier()>prevTier) showPromotionEffect(engine.player_class_tier()); hideLevelUp(); }
        }
      });
      document.addEventListener('keyup', e => {
        const k = keyMap[e.code] || e.key.toLowerCase();
        engine.on_key_up(k);
      });

      // Mouse click → active skill
      const gameCanvas = document.getElementById('game-canvas');
      // Prevent browser defaults
      gameCanvas.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('contextmenu', e => { if (gameStarted) e.preventDefault(); });
      gameCanvas.addEventListener('selectstart', e => e.preventDefault());

      // === Gesture Skill System ===
      let dragStart = null;
      let isDragging = false;
      let magicCircle = null;
      let dragPoints = []; // for gesture recognition
      let arrowEl = null;
      let trailCanvas = null;

      gameCanvas.addEventListener('mousedown', e => {
        if (!gameStarted || !engine) return;
        e.preventDefault();
        if (e.button === 0 && engine.player_class_tier() > 0) {
          // Left click: 1st class skill (element)
          dragStart = { x: e.clientX, y: e.clientY, button: 0 };
          dragPoints = [{ x: e.clientX, y: e.clientY }];
          isDragging = false;
          showSpellGuide();
        } else if (e.button === 2 && engine.player_class_tier() >= 2) {
          // Right click: 2nd class skill
          dragStart = { x: e.clientX, y: e.clientY, button: 2 };
          dragPoints = [{ x: e.clientX, y: e.clientY }];
          isDragging = false;
          showSpellGuide();
        }
      });

      document.addEventListener('mousemove', e => {
        if (!dragStart) return;
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        dragPoints.push({ x: e.clientX, y: e.clientY });

        if (dist > 20) {
          isDragging = true;

          // Detect gesture type
          const gesture = detectGesture(dragPoints, dragStart);

          // Draw drag trail (spell trajectory)
          if (!trailCanvas) {
            const tc = document.createElement('canvas');
            tc.width = window.innerWidth;
            tc.height = window.innerHeight;
            tc.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;z-index:899';
            document.body.appendChild(tc);
            trailCanvas = tc;
          }
          const ctx = trailCanvas.getContext('2d');
          ctx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
          if (dragPoints.length > 2) {
            const elem = engine.player_class_element() || engine.active_element();
            const trailColors = { 1:'rgba(255,100,0,0.5)', 2:'rgba(100,150,200,0.4)', 3:'rgba(255,220,50,0.5)', 4:'rgba(120,50,180,0.4)', 0:'rgba(150,150,255,0.4)' };
            ctx.strokeStyle = trailColors[elem] || trailColors[0];
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(dragPoints[0].x, dragPoints[0].y);
            for (let p = 1; p < dragPoints.length; p++) {
              ctx.lineTo(dragPoints[p].x, dragPoints[p].y);
            }
            ctx.stroke();

            // If circle detected, show glow
            if (gesture === 'circle') {
              ctx.strokeStyle = 'rgba(255,200,0,0.7)';
              ctx.lineWidth = 5;
              ctx.stroke();
            }
          }

          // Show magic circle at player
          if (!magicCircle) {
            magicCircle = document.createElement('div');
            magicCircle.style.cssText = 'position:fixed;pointer-events:none;z-index:900;border-radius:50%;border:2px solid;animation:magic-spin 1s linear infinite;box-shadow:0 0 15px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:bold;text-shadow:0 0 5px rgba(0,0,0,0.8)';
            document.body.appendChild(magicCircle);
          }
          // Arrow indicator
          if (!arrowEl) {
            arrowEl = document.createElement('div');
            arrowEl.style.cssText = 'position:fixed;pointer-events:none;z-index:901;font-size:28px;text-shadow:0 0 8px rgba(255,255,255,0.5)';
            document.body.appendChild(arrowEl);
          }

          const size = Math.min(50 + dist * 0.4, 100);
          const elem = engine.player_class_element() || engine.active_element();
          const isRight = dragStart.button === 2;
          const colors = isRight
            ? { 1:'#ff88cc', 2:'#88ffcc', 3:'#ccff88', 4:'#cc88ff', 0:'#ccaaff' }
            : { 1:'#ff4400', 2:'#44ccff', 3:'#ffcc00', 4:'#9933ff', 0:'#8888ff' };
          const color = colors[elem] || (isRight ? '#ccaaff' : '#8888ff');
          magicCircle.style.width = size + 'px';
          magicCircle.style.height = size + 'px';
          magicCircle.style.borderColor = color;
          magicCircle.style.boxShadow = `0 0 ${size/4}px ${color}, inset 0 0 ${size/6}px ${color}`;

          // Gesture label on circle
          const labels = { outward: '⚔️ ATK', inward: '🛡️ DEF', circle: '💫 ULT' };
          magicCircle.textContent = labels[gesture] || '...';

          // Position at player
          if (renderer && renderer.camera) {
            const pos = renderer.projectToScreen(engine.player_x(), 0.5, engine.player_z());
            magicCircle.style.left = (pos.x - size/2) + 'px';
            magicCircle.style.top = (pos.y - size/2) + 'px';

            // Arrow: show direction for outward
            if (gesture === 'outward') {
              const angle = Math.atan2(dy, dx);
              // 8 directions: right=0, down-right=1, down=2...
              const arrows = ['➡️', '↘️', '⬇️', '↙️', '⬅️', '↖️', '⬆️', '↗️'];
              let idx = Math.round(angle / (Math.PI / 4));
              if (idx < 0) idx += 8;
              idx = idx % 8;
              arrowEl.textContent = arrows[idx];
              arrowEl.style.fontSize = '32px';
              // Position: ahead of player in drag direction
              const arrowDist = 50;
              arrowEl.style.left = (pos.x + Math.cos(angle) * arrowDist - 16) + 'px';
              arrowEl.style.top = (pos.y + Math.sin(angle) * arrowDist - 16) + 'px';
              arrowEl.style.opacity = '1';
            } else if (gesture === 'inward') {
              arrowEl.textContent = '🛡️';
              arrowEl.style.fontSize = '28px';
              arrowEl.style.left = (pos.x - 14) + 'px';
              arrowEl.style.top = (pos.y - 14) + 'px';
              arrowEl.style.opacity = '1';
            } else if (gesture === 'circle') {
              arrowEl.textContent = '🌀';
              arrowEl.style.left = (pos.x - 14) + 'px';
              arrowEl.style.top = (pos.y - 40) + 'px';
              arrowEl.style.opacity = '1';
            } else {
              arrowEl.style.opacity = '0.3';
              arrowEl.textContent = '?';
            }
          }
        }
      });

      document.addEventListener('mouseup', e => {
        if (!dragStart || !engine) { dragStart = null; return; }
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const btn = dragStart.button;

        if (magicCircle) { magicCircle.remove(); magicCircle = null; }
        if (arrowEl) { arrowEl.remove(); arrowEl = null; }
        if (trailCanvas) { trailCanvas.remove(); trailCanvas = null; }
        hideSpellGuide();

        if (btn === 0 && engine.player_class_tier() > 0) {
          // LEFT CLICK: 1st class element skills
          if (isDragging && dist > 30) {
            const gesture = detectGesture(dragPoints, dragStart);
            const angle = Math.atan2(-dy, dx);

            if (gesture === 'outward') {
              if (!checkMana(20)) { dragStart=null;isDragging=false;dragPoints=[];return; }
              engine.use_directional_skill(angle);
              renderer.spawnDirectionalEffect(engine.player_x(), engine.player_z(), angle, engine.player_class_element() || engine.active_element(), 7);
              renderer.shake(0.35, 0.1);
              showSkillName('outward');
            } else if (gesture === 'inward') {
              engine.use_shield_skill(); sound.playShield();
              renderer.spawnShieldEffect(engine.player_x(), engine.player_z(), engine.player_class_element() || engine.active_element());
              renderer.shake(0.15, 0.05);
              showSkillName('inward');
            } else if (gesture === 'circle') {
              if (!checkMana(50)) { dragStart=null;isDragging=false;dragPoints=[];return; }
              engine.use_ultimate_skill(); sound.playUltimate(engine.player_class_element() || engine.active_element());
              renderer.spawnUltimateEffect(engine.player_x(), engine.player_z(), engine.player_class_element() || engine.active_element(), 8);
              renderer.shake(0.6, 0.2);
              showSkillName('circle');
              // Screen flash
              const flash = document.createElement('div');
              flash.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.3);pointer-events:none;z-index:999;animation:flash-fade 0.3s ease-out forwards';
              document.body.appendChild(flash);
              setTimeout(() => flash.remove(), 300);
            }
          } else if (!isDragging) {
            engine.use_active_skill();
            renderer.shake(0.2, 0.08);
          }
        } else if (btn === 2 && engine.player_class_tier() >= 2) {
          // RIGHT CLICK: 2nd class skills
          if (isDragging && dist > 30) {
            const gesture = detectGesture(dragPoints, dragStart);
            const angle = Math.atan2(-dy, dx);

            if (gesture === 'outward') {
              if (!checkMana(20)) { dragStart=null;isDragging=false;dragPoints=[];return; }
              engine.use_directional_skill(angle);
              const elem = engine.player_class_element() || engine.active_element();
              renderer.spawnAdvancedDirectionalEffect(engine.player_x(), engine.player_z(), angle, elem, 9);
              sound.playAdvancedSkill(elem);
              renderer.shake(0.55, 0.15);
              showSkillName('outward');
            } else if (gesture === 'circle') {
              if (!checkMana(50)) { dragStart=null;isDragging=false;dragPoints=[];return; }
              const elem = engine.player_class_element() || engine.active_element();
              engine.use_ultimate_skill();
              sound.playAdvancedUltimate(elem);
              renderer.spawnAdvancedUltimateEffect(engine.player_x(), engine.player_z(), elem, 12);
              renderer.shake(0.9, 0.3);
              showSkillName('circle');
              // Double flash for advanced ult
              const flash = document.createElement('div');
              flash.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:999;animation:flash-fade 0.4s ease-out forwards';
              flash.style.background = elem===1?'rgba(255,100,0,0.3)':elem===2?'rgba(100,200,255,0.3)':elem===3?'rgba(255,255,0,0.3)':'rgba(150,50,255,0.3)';
              document.body.appendChild(flash);
              setTimeout(() => flash.remove(), 400);
              renderer.shake(0.7, 0.25);
              showSkillName('circle');
            } else {
              engine.use_active_skill();
              renderer.shake(0.3, 0.1);
              showSkillName('outward');
            }
          } else if (!isDragging) {
            // Right click tap = 2nd class quick skill
            engine.use_active_skill();
            renderer.spawnSkillEffect(engine.player_x(), engine.player_z(), engine.active_element(), 4);
            renderer.shake(0.25, 0.08);
          }
        }

        dragStart = null;
        isDragging = false;
        dragPoints = [];
      });

      // Gesture detection: outward / inward / circle
      function detectGesture(points, start) {
        if (points.length < 5) return 'unknown';

        const last = points[points.length - 1];
        const dx = last.x - start.x;
        const dy = last.y - start.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        // Check for circle: must be deliberate full loop
        if (points.length > 30) {
          let totalAngle = 0;
          for (let i = 2; i < points.length; i++) {
            const ax = points[i-1].x - points[i-2].x;
            const ay = points[i-1].y - points[i-2].y;
            const bx = points[i].x - points[i-1].x;
            const by = points[i].y - points[i-1].y;
            const cross = ax * by - ay * bx;
            const dot = ax * bx + ay * by;
            totalAngle += Math.atan2(cross, dot);
          }
          // Must rotate 340°+ AND end reasonably near start (within 120px)
          const endDist = Math.sqrt((last.x - start.x)**2 + (last.y - start.y)**2);
          if (Math.abs(totalAngle) > Math.PI * 1.9 && endDist < 120) return 'circle';
        }

        // Check direction relative to player screen position
        if (renderer && renderer.camera) {
          const playerScreen = renderer.projectToScreen(engine.player_x(), 0.5, engine.player_z());
          const startToPlayer = Math.sqrt((start.x - playerScreen.x)**2 + (start.y - playerScreen.y)**2);
          const endToPlayer = Math.sqrt((last.x - playerScreen.x)**2 + (last.y - playerScreen.y)**2);

          if (endToPlayer < startToPlayer - 20) return 'inward'; // moved toward player
          if (endToPlayer > startToPlayer + 20) return 'outward'; // moved away from player
        }

        // Fallback: if dragging away from start = outward
        if (dist > 40) return 'outward';
        return 'unknown';
      }

      // Mana warning flash
      function flashManaWarning() {
        const bar = document.getElementById('stamina-bar-bg');
        if (!bar) return;
        bar.style.border = '2px solid #ff4444';
        const warn = document.createElement('div');
        warn.textContent = '⚠️ Mana 부족!';
        warn.style.cssText = 'position:fixed;top:45%;left:50%;transform:translateX(-50%);color:#ff4444;font-size:16px;font-weight:bold;pointer-events:none;z-index:960;text-shadow:0 0 8px rgba(255,0,0,0.5);animation:skill-name-fade 1s ease-out forwards';
        document.body.appendChild(warn);
        setTimeout(() => { warn.remove(); bar.style.border = '1px solid #2a4a2a'; }, 1000);
      }

      // Check stamina before skill (returns false if not enough)
      function checkMana(cost) {
        if (engine.player_stamina() < cost) {
          flashManaWarning();
          return false;
        }
        return true;
      }

      // Spell Guide (shows when holding click)
      let spellGuideEl = null;
      function showSpellGuide() {
        if (spellGuideEl) return;
        spellGuideEl = document.createElement('div');
        spellGuideEl.style.cssText = 'position:fixed;top:80px;right:16px;background:rgba(0,0,0,0.85);border:1px solid #444;border-radius:8px;padding:10px 14px;pointer-events:none;z-index:950;font-size:11px;color:#ccc;line-height:2;min-width:140px';
        spellGuideEl.innerHTML = `
          <div style="color:#ff8844;font-weight:bold;margin-bottom:4px">🖱️ Spell Guide</div>
          <div>→ 바깥 드래그 = <span style="color:#ff8844">⚔️ ATK</span></div>
          <div>← 안쪽 드래그 = <span style="color:#44ff88">🛡️ DEF</span></div>
          <div>○ 한바퀴 = <span style="color:#ffcc00">💫 ULT</span></div>
          <div style="color:#555;font-size:9px;margin-top:4px">놓으면 시전!</div>
        `;
        document.body.appendChild(spellGuideEl);
      }
      function hideSpellGuide() {
        if (spellGuideEl) { spellGuideEl.remove(); spellGuideEl = null; }
      }

      function showSkillName(gesture) {
        const count = engine.learned_skill_count();
        if (count === 0) return;
        let name = '';
        let color = '#fff';
        if (gesture === 'outward') {
          for (let i = 0; i < count; i++) { if (engine.learned_skill_type(i) === 0) { name = engine.learned_skill_name(i); break; } }
          color = '#ff8844';
        } else if (gesture === 'inward') {
          for (let i = 0; i < count; i++) { if (engine.learned_skill_type(i) === 1) { name = engine.learned_skill_name(i); break; } }
          if (!name) name = 'Shield';
          color = '#44ff88';
        } else if (gesture === 'circle') {
          for (let i = 0; i < count; i++) { if (engine.learned_skill_type(i) === 2) { name = engine.learned_skill_name(i); break; } }
          if (!name) name = 'Ultimate';
          color = '#ffcc00';
        }
        if (!name) name = 'Skill';

        const el = document.createElement('div');
        el.textContent = gesture === 'circle' ? `✨ ${name} ✨` : name;
        el.style.cssText = `position:fixed;top:38%;left:50%;transform:translateX(-50%);color:${color};font-size:${gesture==='circle'?'28px':'20px'};font-weight:bold;pointer-events:none;z-index:950;text-shadow:0 0 12px ${color},0 2px 4px rgba(0,0,0,0.8);animation:skill-name-fade 1.2s ease-out forwards`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1200);
      }

      document.getElementById('resume-btn').addEventListener('click', () => {
        engine.toggle_pause();
        document.getElementById('pause-menu').style.display = 'none';
      });

      function updatePauseSkills() {
        let html = '<b>📜 Status</b><br><br>';

        // Element Orbs
        const f = engine.fire_level(), ic = engine.ice_level(), t = engine.thunder_level(), p = engine.poison_level();
        html += '<b>⚗️ Element Orbs</b><br>';
        if (f > 0) html += `  🔥 Fire: ${f}<br>`;
        if (ic > 0) html += `  ❄️ Ice: ${ic}<br>`;
        if (t > 0) html += `  ⚡ Thunder: ${t}<br>`;
        if (p > 0) html += `  ☠️ Poison: ${p}<br>`;
        if (f + ic + t + p === 0) html += '  <span style="color:#666">없음</span><br>';

        // Current Class
        const tier = engine.player_class_tier();
        if (tier > 0) {
          const tierEmoji = {1:'⭐',2:'🌟',3:'👑'};
          html += `<br><b>${tierEmoji[tier] || ''} ${engine.player_class_name()}</b> (Tier ${tier})<br>`;

          // Learned Skills
          const skillCount = engine.learned_skill_count();
          if (skillCount > 0) {
            html += '<br><b>🗡️ Class Skills</b><br>';
            for (let i = 0; i < skillCount; i++) {
              const name = engine.learned_skill_name(i);
              const lv = engine.learned_skill_level(i);
              html += `  📈 ${name} <span style="color:#ffcc00">Lv.${lv}</span><br>`;
            }
          }
        } else {
          html += '<br><span style="color:#666">Lv.10에서 첫 전직 가능</span><br>';
          html += '<span style="color:#555;font-size:10px">원소를 모아 조합 조건을 맞추세요!</span>';
        }

        // Next promotion hint
        if (tier === 0 || tier === 1 || tier === 2) {
          const nextLevel = tier === 0 ? 10 : tier === 1 ? 25 : 45;
          const currentLevel = engine.player_level();
          if (currentLevel < nextLevel) {
            html += `<br><br><span style="color:#888;font-size:10px">다음 전직: Lv.${nextLevel}</span>`;
          }
        }

        document.getElementById('pause-skills').innerHTML = html;
      }

      // Level up buttons
      for (let i = 0; i < 3; i++) {
        document.getElementById(`choice-${i}`).addEventListener('click', () => {
          const prevTier = engine.player_class_tier();
          engine.choose_upgrade(i);
          const newTier = engine.player_class_tier();
          if (newTier > prevTier) showPromotionEffect(newTier);
          hideLevelUp();
        });
      }

      function showLevelUp() {
        const el = document.getElementById('levelup');
        el.style.display = 'block';
        el.classList.add('shown');
        for (let i = 0; i < 3; i++) {
          const id = engine.level_up_choice(i);
          const name = getUpgradeName(id);
          const desc = getUpgradeDesc(id);
          document.getElementById(`choice-${i}`).innerHTML = `<span>[${i+1}]</span> ${name}<br><small style="color:#999;font-size:11px">${desc}</small>`;
        }
      }
      function hideLevelUp() {
        const el = document.getElementById('levelup');
        el.style.display = 'none';
        el.classList.remove('shown');
        levelUpShown = false;
        sound.playPickup();
      }

      function showPromotionEffect(tier) {
        // Sound
        sound.playLevelUp();
        setTimeout(() => sound.playShield(), 200);

        // Screen flash (gold/element color)
        const colors = ['', 'rgba(255,200,50,0.4)', 'rgba(100,200,255,0.4)', 'rgba(255,100,255,0.4)'];
        const flash = document.createElement('div');
        flash.style.cssText = `position:fixed;top:0;left:0;right:0;bottom:0;background:${colors[tier]||colors[1]};pointer-events:none;z-index:9999;transition:opacity 0.8s`;
        document.body.appendChild(flash);
        setTimeout(() => { flash.style.opacity = '0'; }, 100);
        setTimeout(() => flash.remove(), 900);

        // Big text announcement
        const tierNames = ['', '⚔️ 1차 전직!', '🌟 2차 전직!', '👑 3차 전직!'];
        const className = engine.player_class_name() || '';
        const txt = document.createElement('div');
        txt.style.cssText = 'position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);z-index:9999;pointer-events:none;text-align:center;animation:promo-pop 1.5s ease-out forwards';
        txt.innerHTML = `<div style="font-size:36px;color:#ffd700;text-shadow:0 0 20px #ff8800,0 0 40px #ff4400;font-weight:bold">${tierNames[tier]}</div><div style="font-size:20px;color:#fff;margin-top:8px;text-shadow:0 0 10px rgba(255,255,255,0.8)">${className}</div>`;
        document.body.appendChild(txt);
        setTimeout(() => txt.remove(), 2000);

        // Camera + hit stop for drama
        renderer.shake(0.4, 0.2);
        renderer.hitStop(0.15);
      }

      // HUD
      const logLines = [];
      let lastSkillKey = '';
      let levelUpShown = false;
      function updateHUD() {
        const promoted = engine.player_promoted();
        const className = promoted ? engine.player_class_name() : '';
        const tierEmoji = { 1:'⭐', 2:'🌟', 3:'👑' };
        const tier = engine.player_class_tier();
        const tierStr = tierEmoji[tier] || '';
        document.getElementById('level').textContent = engine.player_level() + (className ? ` ${tierStr}${className}` : '');

        // Portrait: 원소에 따라 변경
        const elem = engine.active_element();
        const portrait = document.getElementById('portrait');
        const portraitIcons = { 0:'🗡️', 1:'🔥', 2:'❄️', 3:'⚡', 4:'☠️' };
        const portraitBorders = { 0:'#555', 1:'#ff4400', 2:'#44ccff', 3:'#ffcc00', 4:'#44ff44' };
        portrait.textContent = portraitIcons[elem] || '🗡️';
        portrait.style.borderColor = portraitBorders[elem] || '#555';
        if (promoted) portrait.style.boxShadow = `0 0 10px ${portraitBorders[elem]}`;
        else portrait.style.boxShadow = 'none';
        const hpPct = Math.max(0, engine.player_hp() / engine.player_max_hp() * 100);
        document.getElementById('hp-bar-fill').style.width = hpPct + '%';
        // Shield: fills from where HP ends (right side of HP bar)
        const shieldPct = Math.max(0, engine.player_shield() / engine.player_max_hp() * 100);
        const shieldBar = document.getElementById('shield-bar-fill');
        shieldBar.style.width = shieldPct + '%';
        shieldBar.style.left = hpPct + '%';
        const xpPct = engine.player_xp() / engine.player_xp_max() * 100;
        document.getElementById('xp-bar-fill').style.width = xpPct + '%';

        // Stat panel
        const sp = document.getElementById('stat-panel');
        if (sp) sp.innerHTML =
          `⚔️ ATK <span style="color:#ff8844">${Math.round(engine.player_damage())}</span><br>` +
          `⚡ SPD <span style="color:#44ccff">${engine.player_atk_speed().toFixed(1)}/s</span><br>` +
          `🎯 RNG <span style="color:#88ff44">${engine.player_range().toFixed(1)}</span><br>` +
          `💥 CRT <span style="color:#ff4488">${Math.round(engine.player_crit()*100)}%</span><br>` +
          `🗡️ PRC <span style="color:#ffcc44">${engine.player_pierce()}</span> ` +
          `🔫 ×<span style="color:#44ffcc">${engine.player_multi()}</span><br>` +
          `🧛 STEAL <span style="color:#ff44ff">${Math.round(engine.player_lifesteal()*100)}%</span>`;

        // Skill slots (only re-render when changed)
        const SKILL_ICONS = { 0:'🔥', 4:'❄️', 2:'⚡', 7:'☠️' };
        const SKILL_COLORS = { 0:'#ff4400', 4:'#44ccff', 2:'#ffcc00', 7:'#44ff44' };
        const SKILL_NAMES = { 0:'Fire Blade', 4:'Frost Blade', 2:'Thunder Blade', 7:'Poison Blade' };
        const SKILL_DESC = {
          0:'🔥 화염 검기. ATK+5, AOE+0.8\nLv2: 주변 화염 오브\nLv5: MAX - 인페르노',
          4:'❄️ 빙결 검기. ATK+5, RNG+0.5\nLv2: 적 슬로우\nLv5: MAX - 절대영도',
          2:'⚡ 번개 검기. ATK+5, 공속↑\nLv2: 이동→공속 보너스\nLv5: MAX - 번개 폭풍',
          7:'☠️ 맹독 검기. ATK+5, 흡혈+3%\nLv2: 주변 DOT\nLv5: MAX - 역병',
        };
        const slotCount = engine.skill_slot_count();
        const classSkillCount = engine.learned_skill_count();
        let newSkillKey = '';
        for (let i = 0; i < slotCount; i++) { newSkillKey += engine.skill_slot_id(i) + ':' + engine.skill_slot_level(i) + ','; }
        newSkillKey += '|' + classSkillCount;
        for (let i = 0; i < classSkillCount; i++) { newSkillKey += engine.learned_skill_id(i) + ':' + engine.learned_skill_level(i) + ','; }

        if (newSkillKey !== lastSkillKey) {
          lastSkillKey = newSkillKey;
          let slotsHtml = '';
          // Element orb icons
          for (let i = 0; i < slotCount; i++) {
            const id = engine.skill_slot_id(i);
            const lv = engine.skill_slot_level(i);
            const icon = SKILL_ICONS[id] || '⭐';
            const color = SKILL_COLORS[id] || '#888';
            const name = SKILL_NAMES[id] || 'Skill';
            slotsHtml += `<div class="skill-icon" style="background:${color}22;border-color:${color}">
              ${icon}<span class="sk-lvl">${lv}</span>
              <div class="sk-tooltip"><b style="color:${color}">${name} Lv.${lv}</b></div>
            </div>`;
          }
          // Class skill icons (after promotion)
          if (classSkillCount > 0) {
            slotsHtml += '<div style="width:2px;height:28px;background:#333;margin:0 4px"></div>'; // separator
            for (let i = 0; i < classSkillCount; i++) {
              const name = engine.learned_skill_name(i);
              const lv = engine.learned_skill_level(i);
              const desc = engine.learned_skill_desc(i);
              const sType = engine.learned_skill_type(i); // 0=active, 1=passive, 2=ultimate
              const typeIcon = sType === 0 ? '⚔️' : sType === 1 ? '🛡️' : '💫';
              const typeLabel = sType === 0 ? 'AUTO' : sType === 1 ? 'PASSIVE' : 'ULT';
              const typeColor = sType === 0 ? '#44ccff' : sType === 1 ? '#44ff44' : '#ffcc00';
              slotsHtml += `<div class="skill-icon class-skill" data-skill-idx="${i}" style="background:${typeColor}15;border-color:${typeColor}">
                ${typeIcon}<span class="sk-lvl" style="color:${typeColor}">${lv}</span>
                <div class="sk-cd-overlay"></div>
                <div class="sk-tooltip"><b style="color:${typeColor}">${name} Lv.${lv}</b><br><span style="color:#888">[${typeLabel}]</span> ${desc}</div>
              </div>`;
            }
          }
          document.getElementById('skill-slots').innerHTML = slotsHtml;
          document.querySelectorAll('.skill-icon').forEach(el => {
            el.addEventListener('click', (e) => {
              const wasActive = el.classList.contains('active-tip');
              document.querySelectorAll('.skill-icon').forEach(x => x.classList.remove('active-tip'));
              if (!wasActive) el.classList.add('active-tip');
              e.stopPropagation();
            });
          });
        }

        // Update class skill cooldown overlays (clock animation)
        document.querySelectorAll('.class-skill').forEach(el => {
          const idx = parseInt(el.dataset.skillIdx);
          if (isNaN(idx)) return;
          const cd = engine.learned_skill_cd(idx);
          const maxCd = engine.learned_skill_max_cd(idx);
          const overlay = el.querySelector('.sk-cd-overlay');
          if (overlay) {
            if (cd > 0) {
              const pct = cd / maxCd;
              overlay.style.background = `conic-gradient(rgba(0,0,0,0.7) ${pct*360}deg, transparent ${pct*360}deg)`;
              overlay.style.display = 'block';
            } else {
              overlay.style.display = 'none';
            }
          }
        });

        const t = Math.floor(engine.game_time());
        const min = Math.floor(t / 60);
        const sec = t % 60;
        document.getElementById('timer').textContent = `${min}:${sec.toString().padStart(2,'0')}`;
        const waveNum = engine.wave_number();
        const isBossWave = waveNum > 0 && waveNum % 10 === 0;
        document.getElementById('kills').textContent = isBossWave
          ? `⚠️ WAVE 0 — BOSS ⚠️ | ${engine.kills()} kills`
          : `Wave ${waveNum} | ${engine.kills()} kills`;

        // Boss wave entrance effect (once)
        if (isBossWave && !this._bossShown) {
          this._bossShown = true;
          // Red flash
          const flash = document.createElement('div');
          flash.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,0,0,0.4);pointer-events:none;z-index:9999;transition:opacity 1s';
          document.body.appendChild(flash);
          setTimeout(() => { flash.style.opacity = '0'; }, 200);
          setTimeout(() => flash.remove(), 1200);
          // Warning text
          const warn = document.createElement('div');
          warn.style.cssText = 'position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:9999;pointer-events:none;text-align:center;animation:promo-pop 2s ease-out forwards';
          warn.innerHTML = '<div style="font-size:42px;color:#ff2200;text-shadow:0 0 30px #ff0000,0 0 60px #880000;font-weight:bold">💀 BOSS 💀</div><div style="font-size:18px;color:#ffaa00;margin-top:8px">ALL ENEMIES CLEARED — DUEL!</div>';
          document.body.appendChild(warn);
          setTimeout(() => warn.remove(), 2500);
          renderer.shake(0.8, 0.3);
          renderer.hitStop(0.2);
          sound.playUltimate(1); // dramatic sound
        } else if (!isBossWave) {
          this._bossShown = false;
        }

        // Boss HP bar
        if (engine.boss_active()) {
          let bossBar = document.getElementById('boss-bar');
          if (!bossBar) {
            bossBar = document.createElement('div');
            bossBar.id = 'boss-bar';
            bossBar.style.cssText = 'position:fixed;top:50px;left:50%;transform:translateX(-50%);width:300px;text-align:center;z-index:100';
            bossBar.innerHTML = '<div style="color:#ff4444;font-size:12px;margin-bottom:4px">💀 BOSS</div><div style="width:100%;height:10px;background:#333;border-radius:5px;border:1px solid #ff4444"><div id="boss-hp-fill" style="height:100%;background:linear-gradient(90deg,#ff2222,#ff6644);border-radius:4px;transition:width 0.1s"></div></div>';
            document.body.appendChild(bossBar);
          }
          document.getElementById('boss-hp-fill').style.width = (engine.boss_hp_pct() * 100) + '%';
        } else {
          const bossBar = document.getElementById('boss-bar');
          if (bossBar) bossBar.remove();
        }

        if (engine.level_up_pending() && !levelUpShown) { showLevelUp(); levelUpShown = true; sound.playLevelUp(); }

        let log;
        while ((log = engine.pop_log()) !== undefined) { logLines.push(log); if (logLines.length > 4) logLines.shift(); }
        document.getElementById('log').textContent = logLines.join('\n');

        // Dash cooldown UI
        const dashCd = engine.player_dash_cooldown();
        const dashBar = document.getElementById('dash-bar');
        const dashText = document.getElementById('dash-cd-text');
        const dType = engine.player_dash_type();
        const dashNames = { 1:'🔥 BLINK', 2:'❄️ SKATE', 3:'⚡ DASH×3', 4:'☠️ SMOKE', 5:'💨 DASH' };
        const dashColors = { 1:'#ff4400', 2:'#44ccff', 3:'#ffcc00', 4:'#44ff44', 5:'#44ccff' };
        const dashMaxCd = { 1:3.0, 2:0, 3:0.8, 4:4.0, 5:2.0 };
        const maxCd = dashMaxCd[dType] || 2.0;
        document.querySelector('#dash-ui span').textContent = dashNames[dType] || '💨 DASH';
        if (dType === 2) {
          // Ice: no dash, show passive
          dashBar.style.width = '100%';
          dashBar.style.background = '#44ccff';
          dashText.textContent = '+40% SPD';
        } else if (dType === 3) {
          // Thunder: show charges
          const charges = engine.player_dash_charges();
          dashBar.style.width = (charges / 3 * 100) + '%';
          dashBar.style.background = charges > 0 ? '#ffcc00' : '#333';
          dashText.textContent = `⚡${charges}/3`;
        } else if (dashCd > 0) {
          dashBar.style.width = Math.max(0, (1 - dashCd / maxCd) * 100) + '%';
          dashBar.style.background = '#666';
          dashText.textContent = dashCd.toFixed(1) + 's';
        } else {
          dashBar.style.width = '100%';
          dashBar.style.background = dashColors[dType] || '#44ccff';
          dashText.textContent = 'READY';
        }

        // Stamina bar (visible after promotion)
        const staminaBarBg = document.getElementById('stamina-bar-bg');
        if (engine.player_class_tier() > 0) {
          staminaBarBg.style.display = 'block';
          const stPct = engine.player_stamina() / engine.player_max_stamina() * 100;
          document.getElementById('stamina-bar-fill').style.width = stPct + '%';
        }
      }

      // Damage popup system
      function showDamagePopup(wx, wz, amount, isCrit) {
        const el = document.createElement('div');
        el.className = 'dmg-popup' + (isCrit ? ' crit' : '');
        el.textContent = Math.round(amount);

        // Size proportional to damage (bigger = bigger text)
        const baseSize = isCrit ? 18 : 13;
        const bonusSize = Math.min(12, Math.floor(amount / 30));
        el.style.fontSize = (baseSize + bonusSize) + 'px';

        // Convert world pos to screen pos
        const canvas = document.getElementById('game-canvas');
        if (renderer && renderer.camera) {
          const pos = renderer.projectToScreen(wx, 1.8, wz);
          el.style.left = pos.x + 'px';
          el.style.top = (pos.y - 20) + 'px';
        } else {
          el.style.left = (window.innerWidth / 2) + 'px';
          el.style.top = (window.innerHeight / 2 - 50) + 'px';
        }

        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }


      // Game Over screen with achievements
      function showGameOver(eng) {
        const t = Math.floor(eng.game_time());
        const min = Math.floor(t / 60);
        const sec = t % 60;
        const kills = eng.kills();
        const level = eng.player_level();
        const points = eng.final_points();

        // Add points to saved total
        let totalPoints = parseInt(localStorage.getItem('unplug_points') || '0');
        totalPoints += points;
        localStorage.setItem('unplug_points', totalPoints);

        document.getElementById('final-stats').innerHTML =
          `⏱️ Survived: ${min}:${sec.toString().padStart(2,'0')}<br>` +
          `☠️ Kills: ${kills}<br>` +
          `⭐ Level: ${level}<br>` +
          `⚔️ Final ATK: ${Math.round(eng.player_damage())}`;

        document.getElementById('points-earned').innerHTML =
          `💰 +${points} pts (Total: ${totalPoints})`;

        const titles = [];
        if (kills >= 100) titles.push('💀 Century Slayer');
        if (kills >= 50) titles.push('⚔️ Warrior');
        if (kills >= 20) titles.push('🗡️ Fighter');
        if (level >= 15) titles.push('👑 Legend');
        if (level >= 10) titles.push('📈 Veteran');
        if (level >= 5) titles.push('🌱 Apprentice');
        if (t >= 300) titles.push('⏳ Eternal Survivor');
        if (t >= 180) titles.push('🕐 Endurer');
        if (t >= 60) titles.push('⌛ Lasted a Minute');
        if (eng.player_promoted()) titles.push('👑 Class Promoted');
        if (eng.player_damage() >= 100) titles.push('🔥 Weapon Master');

        document.getElementById('achievements').innerHTML =
          titles.length > 0 ? titles.map(t => '🏆 ' + t).join('<br>') : '';

        document.getElementById('gameover-screen').style.display = 'flex';
      }

      // === GACHA SYSTEM ===
      // Game loop
      let lastTime = 0;
      let gameOverShown = false;
      function loop(timestamp) {
        const dt = lastTime ? (timestamp - lastTime) / 1000 : 0.016;
        lastTime = timestamp;

        if (!gameStarted) { requestAnimationFrame(loop); return; }

        // Game over check
        if (!engine.player_alive() && !gameOverShown) {
          gameOverShown = true;
          showGameOver(engine);
        }

        engine.update(timestamp);

        // Build world state for Three.js
        const enemies = [];
        const ec = engine.enemy_count();
        for (let i = 0; i < ec; i++) {
          enemies.push({ x: engine.enemy_x(i), z: engine.enemy_z(i), type: engine.enemy_type(i), hit: engine.enemy_hit(i) });
        }
        const bullets = [];
        const bc = engine.bullet_count();
        for (let i = 0; i < bc; i++) {
          bullets.push({ x: engine.bullet_x(i), z: engine.bullet_z(i) });
        }
        const orbs = [];
        const oc = engine.orb_count();
        for (let i = 0; i < oc; i++) {
          orbs.push({ x: engine.orb_x(i), z: engine.orb_z(i), type: engine.orb_type(i) });
        }
        // Damage events → popups + slash effects + sound (only when game running)
        if (!engine.level_up_pending()) {
          const dmgCount = engine.damage_event_count();
          const px = engine.player_x(), pz = engine.player_z();
          const atkPower = engine.player_damage();
          const element = engine.active_element(); // 0=none, 1=fire, 2=ice, 3=thunder, 4=poison
          let hasCrit = false;
          for (let i = 0; i < dmgCount; i++) {
            const ex = engine.damage_event_x(i);
            const ez = engine.damage_event_z(i);
            const isCrit = engine.damage_event_crit(i);
            if (isCrit) hasCrit = true;
            showDamagePopup(ex, ez, engine.damage_event_amount(i), isCrit);
            renderer.spawnSlash(px, pz, ex, ez, isCrit, atkPower, element);
            if (i === 0) {
              if (isCrit) sound.playCrit();
              else if (element === 1) sound.playElementFire();
              else if (element === 2) sound.playElementIce();
              else if (element === 3) sound.playElementThunder();
              else if (element === 4) sound.playElementPoison();
              else sound.playHit();
            }
          }
          // Camera shake on hit
          if (hasCrit) { renderer.shake(0.4, 0.12); renderer.hitStop(0.04); }
          else if (dmgCount >= 3) { renderer.shake(0.2, 0.08); }

          // Death events → particles + sound + hit stop
          const deathCount = engine.death_event_count();
          for (let i = 0; i < deathCount; i++) {
            renderer.spawnDeathParticles(engine.death_event_x(i), engine.death_event_z(i), engine.active_element());
            if (i === 0) sound.playDeath();
          }
          if (deathCount > 0) {
            renderer.shake(0.25 + deathCount * 0.1, 0.1);
            renderer.hitStop(0.03 * Math.min(deathCount, 3)); // brief freeze on kill
          }

          // Skill visual events
          const skillEvtCount = engine.skill_event_count();
          for (let i = 0; i < skillEvtCount; i++) {
            renderer.spawnSkillEffect(
              engine.skill_event_x(i), engine.skill_event_z(i),
              engine.skill_event_element(i), engine.skill_event_range(i)
            );
          }
        }

        // Update shield visual (follows player, remove if broken)
        if (renderer._shieldRing && engine.player_shield() <= 0) {
          // Shield broken by damage — remove visual immediately
          renderer.scene.remove(renderer._shieldRing.mesh);
          if (renderer._shieldOuter) renderer.scene.remove(renderer._shieldOuter.mesh);
          renderer._shieldRing = null;
          renderer._shieldOuter = null;
        } else if (renderer.updateShield) {
          renderer.updateShield(engine.player_x(), engine.player_z(), dt / 1000);
        }

        renderer.update({
          playerX: engine.player_x(),
          playerZ: engine.player_z(),
          playerMoving: engine.player_moving(),
          playerDirX: engine.player_dir_x(),
          playerDirZ: engine.player_dir_z(),
          playerHit: engine.player_hit(),
          playerAttacking: engine.player_attacking(),
          playerDashing: engine.player_dashing(),
          dashType: engine.player_dash_type(),
          nearestEnemyDirX: engine.nearest_enemy_dir_x(),
          element: engine.active_element(),
          elementLevel: engine.active_element_level(),
          fireLv: engine.fire_level(),
          iceLv: engine.ice_level(),
          thunderLv: engine.thunder_level(),
          poisonLv: engine.poison_level(),
          bossActive: engine.boss_active(),
          bossX: engine.boss_x(),
          bossZ: engine.boss_z(),
          bossHpPct: engine.boss_hp_pct(),
          promoted: engine.player_promoted(),
          enemies, bullets, orbs,
        }, dt);

        updateHUD();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    main().catch(err => { document.body.innerHTML = `<pre style="color:red;padding:20px">FATAL: ${err}\n${err.stack||''}</pre>`; });
  </script>
</body>
</html>
