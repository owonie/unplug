<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0a0812"/>
      <stop offset="50%" stop-color="#0d0a1a"/>
      <stop offset="100%" stop-color="#1a0a2a"/>
    </linearGradient>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orb">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.03"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- 4 Element orbs (floating, glowing) -->
  <circle cx="200" cy="250" r="30" fill="#ff4400" opacity="0.6" filter="url(#glow-orb)"/>
  <circle cx="1000" cy="200" r="25" fill="#44ccff" opacity="0.5" filter="url(#glow-orb)"/>
  <circle cx="250" cy="450" r="22" fill="#ffcc00" opacity="0.5" filter="url(#glow-orb)"/>
  <circle cx="950" cy="480" r="28" fill="#9933ff" opacity="0.5" filter="url(#glow-orb)"/>
  
  <!-- Title: UNPLUG -->
  <text x="600" y="280" text-anchor="middle" font-family="'Courier New', monospace" font-size="120" font-weight="bold" fill="#ffffff" filter="url(#glow-text)">UNPLUG</text>
  
  <!-- Tagline -->
  <text x="600" y="350" text-anchor="middle" font-family="'Courier New', monospace" font-size="28" fill="#888888" letter-spacing="6">DRAW YOUR POWER. SURVIVE.</text>
  
  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#555555">Gesture Roguelite • 50 Classes • 4 Elements</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#000000" opacity="0.5"/>
  <text x="600" y="612" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#666666">owonie.github.io/unplug</text>
  
  <!-- Element icons small at bottom -->
  <circle cx="480" cy="540" r="8" fill="#ff4400"/>
  <circle cx="540" cy="540" r="8" fill="#44ccff"/>
  <circle cx="600" cy="540" r="8" fill="#ffcc00"/>
  <circle cx="660" cy="540" r="8" fill="#9933ff"/>
</svg>
